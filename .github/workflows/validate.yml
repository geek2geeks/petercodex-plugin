name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall plugins/petercodex-plugin/scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI help smoke
        run: python plugins/petercodex-plugin/scripts/petercodex.py --help
